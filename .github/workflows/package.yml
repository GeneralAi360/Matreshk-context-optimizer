name: Context source package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage tracked source and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess

          root = pathlib.Path.cwd()
          stage = root / 'dist' / 'context-optimizer-v0.4'
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          names = [
              x for x in
              subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              if x
          ]
          manifest = {}
          for name in sorted(names):
              source = root / name
              if source.is_symlink():
                  raise SystemExit(f'Symlink not allowed in package: {name}')
              if not source.is_file():
                  continue
              data = source.read_bytes()
              manifest[name] = hashlib.sha256(data).hexdigest()
              destination = stage / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          manifest_doc = {
              'schema_version': '0.1',
              'commit': commit,
              'files': manifest,
          }
          (stage / 'PACKAGE-MANIFEST.json').write_text(
              json.dumps(manifest_doc, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'packaged_files={len(manifest)} commit={commit}')
          PY
      - name: Verify beginner package entrypoints
        run: |
          test -f dist/context-optimizer-v0.4/install.py
          test -f dist/context-optimizer-v0.4/INSTALL.md
          test -f dist/context-optimizer-v0.4/TESTING.md
          test -f dist/context-optimizer-v0.4/skills/context-optimizer/SKILL.md
          test -f dist/context-optimizer-v0.4/skills/context-optimizer/scripts/quick.py
          test -f dist/context-optimizer-v0.4/PACKAGE-MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-optimizer-v0.4
          path: dist/context-optimizer-v0.4/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
