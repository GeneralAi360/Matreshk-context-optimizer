name: Context Optimizer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        shell: bash
        run: |
          python -m compileall -q skills/context-optimizer/scripts evals
      - name: Static audit smoke
        shell: bash
        run: python evals/run_static_audit_smoke.py
      - name: CodeBurn adapter smoke
        shell: bash
        run: python evals/run_codeburn_adapter_smoke.py
      - name: Gate 5-6 smoke
        shell: bash
        run: python evals/run_gate5_6_smoke.py
      - name: Graphify adapter smoke
        shell: bash
        run: python evals/run_graphify_adapter_smoke.py
      - name: Gate 8-9 smoke
        shell: bash
        run: python evals/run_gate8_9_smoke.py
      - name: Matreshka bridge smoke
        shell: bash
        run: python evals/run_matreshka_bridge_smoke.py
      - name: Benchmark evaluator smoke
        shell: bash
        run: python evals/run_benchmark_evaluator_smoke.py
  real-matreshka-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Context Optimizer
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout Matreshka Agent
        uses: actions/checkout@v4
        with:
          repository: GeneralAi360/matreshka-agent
          ref: main
          path: .pilot/matreshka-agent
      - name: Run real read-only pilot
        shell: bash
        run: |
          python evals/run_real_repository_pilot.py --project .pilot/matreshka-agent/plugins/matreshka-agent --output .pilot/context-optimizer-pilot.json
          cat .pilot/context-optimizer-pilot.json
      - name: Verify target checkout stayed clean
        shell: bash
        run: test -z "$(git -C .pilot/matreshka-agent status --porcelain)"
